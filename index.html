<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>LittleLink</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Replace this with your own, this appears in search results and when sharing.">

    <!-- Keywords -->
    <meta name="keywords" content="your name, industry, and specialties">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://littlelink.diergarten.workers.dev">

    <!-- Author Information -->
    <meta name="author" content="desgart.design">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink">

            <!-- Replace with your name or brand -->
            <h1>
              <div>Töne, die Freude machen</div>
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>eletronic music</p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- Default LittleLink -->
              <a class="button button-default" href="#" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/littlelink.svg" alt="LittleLink Logo">LittleLink</a>

              <!-- Amazon Music -->
              <a class="button button-amazon-music" href="https://music.amazon.de/artists/B09JSZJN6Z/t%25C3%25B6ne-die-freude-machen?marketplaceId=A1PA6795UKMFR9&musicTerritory=DE&ref=dm_sh_PLag0CwqSRtP8MOFeExrDJLWD" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/amazon-music.svg" alt="Amazon Music Logo">Listen on Amazon Music</a>

              <!-- Apple Music Alternate -->
              <a class="button button-apple-music-alt" href="https://music.apple.com/de/artist/t%C3%B6ne-die-freude-machen/1591040377" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/apple-music-alt.svg" alt="Apple Music Logo">Listen on Apple Music</a>

              <!-- SoundCloud -->
              <a class="button button-soundcloud" href="https://soundcloud.com/toenediefreudemachen?utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/soundcloud.svg" alt="SoundCloud Logo">SoundCloud</a>

              <!-- Facebook -->
              <a class="button button-faceb" href="https://www.facebook.com/tdfmfb/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/facebook.svg" alt="Facebook Logo">Find us on Facebook</a>

              <!-- Instagram -->
              <a class="button button-instagram" href="https://www.instagram.com/toenediefreudemachen/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- Shop -->
              <a class="button button-shop" href="https://tdfm.myspreadshop.de/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/shop.svg" alt="Shop Logo">Buy with Shop</a>

              <!-- Spotify -->
              <a class="button button-spotify" href="https://open.spotify.com/artist/2raHa9Aw6njXbMMyKrov2N?si=4EdErQELTYOWjgXSyW1pNw" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/spotify.svg" alt="Spotify Logo">Listen on Spotify</a>

              <!-- Telegram -->
              <a class="button button-telegram" href="https://t.me/tdfmchannel" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/telegram.svg" alt="Telegram Logo">Telegram</a>

              <!-- Threads -->
              <a class="button button-threads" href="https://www.threads.com/@toenediefreudemachen?igshid=NTc4MTIwNjQ2YQ==" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/threads.svg" alt="Threads Logo">Threads</a>

              <!-- WhatsApp -->
              <a class="button button-whatsapp" href="https://chat.whatsapp.com/J9IXymBUEigHsQOzaxIRvn" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/whatsapp.svg" alt="WhatsApp Logo">WhatsApp</a>

              <!-- YouTube Music -->
              <a class="button button-yt" href="https://www.youtube.com/@tdfmtube" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/youtube-music.svg" alt="YouTube Music Logo">Listen on YouTube Music</a>

              <!-- Generic Blog -->
              <a class="button button-default" href="https://desgart-design.github.io/desgart/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-blog.svg" alt="Blog Icon">Read our blog</a>

              <!-- Generic Email -->
              <a class="button button-default" href="mailto:diergarten@tutamail.com" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon">Email Us</a>

            </div>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <a href="privacy.html">Privacy Policy</a> | Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
